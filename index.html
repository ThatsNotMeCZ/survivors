<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermetic Rifts</title>
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <div id="game-container"></div>
    <aside id="hud" class="hidden" aria-live="polite">
      <div id="hud-debug" class="hud-panel hidden">
        <p class="hud-title" id="hud-title">survivors</p>
        <p><span class="k">status</span> <span id="hud-status">boot</span></p>
        <p><span class="k">fps</span> <span id="hud-fps">--</span></p>
        <p id="row-dots"><span class="k">dots</span> <span id="hud-dots">0</span></p>
        <p id="row-coeff" class="hidden"><span class="k">diff</span> <span id="hud-coeff">--</span></p>
        <p><span class="k">renderer</span> <span id="hud-renderer">--</span></p>
      </div>
      <div id="hud-play" class="hidden">
        <div id="hud-objective">
          <p id="hud-objective-label">Survive</p>
          <p id="hud-objective-detail"></p>
          <div id="hud-objective-bar" aria-hidden="true"><div id="hud-objective-fill"></div></div>
        </div>
        <div id="hud-meta">
          <p id="hud-stage">--</p>
          <p id="hud-time">0:00</p>
        </div>
        <div id="hud-vitals">
          <div class="flask" aria-hidden="true">
            <div class="flask-neck"></div>
            <div class="flask-body">
              <div id="hp-fill"></div>
            </div>
          </div>
          <div class="vital-copy">
            <span id="hud-hp">100 / 100</span>
            <div class="xp-line" aria-hidden="true"><div id="xp-fill"></div></div>
            <span id="hud-lv">Lv 1</span>
          </div>
        </div>
        <div id="hud-skills">
          <div class="skill-slot" data-slot="primary" data-key="LMB">
            <div class="skill-sweep"></div>
            <span class="skill-glyph">I</span>
            <span class="skill-cd"></span>
          </div>
          <div class="skill-slot" data-slot="secondary" data-key="RMB">
            <div class="skill-sweep"></div>
            <span class="skill-glyph">II</span>
            <span class="skill-cd"></span>
          </div>
          <div class="skill-slot" data-slot="utility" data-key="⇧">
            <div class="skill-sweep"></div>
            <span class="skill-glyph">III</span>
            <span class="skill-cd"></span>
          </div>
          <div class="skill-slot" data-slot="special" data-key="Q">
            <div class="skill-sweep"></div>
            <span class="skill-glyph">IV</span>
            <span class="skill-cd"></span>
          </div>
        </div>
        <div id="hud-items" class="hidden">
          <div id="hud-item-list"></div>
        </div>
      </div>
    </aside>
    <div id="prompt" class="hidden" aria-live="polite">
      <p id="prompt-title"></p>
      <p id="prompt-detail"></p>
      <div id="prompt-bar" aria-hidden="true"><div id="prompt-fill"></div></div>
    </div>
    <div id="sting" class="hidden" aria-live="polite">
      <p id="sting-kicker"></p>
      <h2 id="sting-title"></h2>
      <p id="sting-sub"></p>
    </div>
    <div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="overlay-title">
      <div id="hall" class="hidden">
        <div class="hall-circle" aria-hidden="true"></div>
        <h1 id="hall-brand" class="hall-brand">Hermetic Rifts</h1>
        <nav id="hall-nav" class="hall-nav"></nav>
        <div id="hall-preview" class="hall-preview"></div>
        <div id="hall-dossier" class="hall-dossier"></div>
        <button type="button" id="hall-commence" class="hall-commence">Commence Transmutation</button>
      </div>
      <div class="overlay-card">
        <p class="overlay-kicker" id="overlay-kicker"></p>
        <h2 id="overlay-title"></h2>
        <p id="overlay-sub"></p>
        <div id="overlay-choices"></div>
        <div id="overlay-body"></div>
        <div id="overlay-actions"></div>
      </div>
    </div>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <p class="overlay-kicker">The choir is unbound</p>
      <h2 id="settings-title">Settings</h2>
      <p class="settings-lead">Volume is stored for when the chamber learns to sing.</p>
      <div id="settings-body"></div>
      <button type="button" id="settings-close" class="seal-btn action-primary">Close</button>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
